name: Atualizar dados do futebol
on:
  schedule: [{cron: "0 9 * * *"}]   # todo dia, 06h (Brasília)
  workflow_dispatch:
permissions: {contents: write}
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python scripts/atualizar_dados.py
        env: {FOOTBALL_TOKEN: "${{ secrets.FOOTBALL_TOKEN }}"}
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/classificacao.json; git diff --staged --quiet || (git commit -m "Atualiza classificação" && git push)
